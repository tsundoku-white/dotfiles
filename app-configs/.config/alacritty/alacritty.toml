# ~/.config/alacritty/alacritty.toml

[terminal.shell]
program = "/usr/bin/fish"
args = ["-l"]

[colors.primary]
background = "#0c0c0c"
foreground = "#dedede"

[colors.cursor]
text = "#dedede"
cursor = "#dedede"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"


# [font.normal]
# family = "Monocraft"
# style = "Light"

# [font.bold]
# family = "Monocraft"
# style = "Bold"

# [font.italic]
# family = "Monocraft"
# style = "Italic"

# [font.bold_italic]
# family = "Monocraft"
# style = "Bold Italic"


[font.bold]
family = "Fira Mono"
style = "Bold"


[font]
size = 15.0

[font.normal]
family = "Fira Mono"
style = "Regular"

[font.italic]
family = "Fira Mono"
style = "Italic"

[font.bold_italic]
family = "Fira Mono"
style = "Bold Italic"

[window]
padding = { x = 5, y = 5 }
decorations = "full"

[scrolling]
history = 10000
multiplier = 3
